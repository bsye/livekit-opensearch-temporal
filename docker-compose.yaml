# LiveKit runs on the host network, which needs Linux or OrbStack on macOS (Docker Desktop doesn't forward it).
# Values like ${LIVEKIT_API_SECRET} come from .env.
name: livekitlocalhost

services:
  # --- LiveKit
  caddy:
    image: livekit/caddyl4
    command: run --config /etc/caddy.yaml --adapter yaml
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/caddy/caddy.yaml:/etc/caddy.yaml:ro
      - ./data/caddy:/data

  livekit:
    image: livekit/livekit-server:v1.13.7
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host
    configs:
      - source: livekit
        target: /etc/livekit.yaml
    depends_on: [redis]

  redis:
    image: redis:7-alpine
    command: redis-server /etc/redis.conf
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./infra/redis/redis.conf:/etc/redis.conf:ro

  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    network_mode: host
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    configs:
      - source: egress
        target: /etc/egress.yaml
    cap_add: [CAP_SYS_ADMIN]
    depends_on: [redis]

  ingress:
    image: livekit/ingress:latest
    restart: unless-stopped
    network_mode: host
    environment:
      INGRESS_CONFIG_FILE: /etc/ingress.yaml
    configs:
      - source: ingress
        target: /etc/ingress.yaml
    depends_on: [redis]

  # --- Temporal (bridge network, published on localhost:7233)
  temporal-postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres:/var/lib/postgresql/data

  temporal-schema:
    image: temporalio/admin-tools:1.31.3
    entrypoint: [sh, /setup.sh, schema]
    environment: &temporal-db
      POSTGRES_SEEDS: temporal-postgresql
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
    volumes:
      - ./infra/temporal/setup.sh:/setup.sh:ro
    depends_on: [temporal-postgresql]

  temporal:
    image: temporalio/server:1.31.3
    restart: unless-stopped
    environment:
      <<: *temporal-db
      DB: postgres12
      TEMPORAL_SERVER_CONFIG_FILE_PATH: /etc/temporal/config/config.yaml
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./infra/temporal/config.yaml:/etc/temporal/config/config.yaml:ro
      - ./infra/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig.yaml:ro
    depends_on:
      temporal-schema:
        condition: service_completed_successfully

  temporal-namespace:
    image: temporalio/admin-tools:1.31.3
    entrypoint: [sh, /setup.sh, namespace]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    volumes:
      - ./infra/temporal/setup.sh:/setup.sh:ro
    depends_on: [temporal]

  temporal-ui:
    image: temporalio/ui:2.54.1
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080" # 8080 on the host is WHIP ingress
    depends_on: [temporal]

  # --- Conversation memory
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9201:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.9.0
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5602:5601"
    depends_on: [opensearch]

configs:
  livekit:
    content: |
      port: 7880
      bind_addresses: [""]
      rtc:
        tcp_port: 7881
        port_range_start: 50000
        port_range_end: 60000
        # true advertises the public IP found via STUN, unreachable from a laptop behind a router.
        # Set node_ip to the LAN IP for other devices to connect.
        use_external_ip: false
        enable_loopback_candidate: false
      redis:
        address: localhost:6379
      turn:
        enabled: true
        domain: turn.localhost
        tls_port: 5349
        udp_port: 3478
        external_tls: true
      ingress:
        rtmp_base_url: rtmp://livekit.localhost:1935/x
        whip_base_url: https://whip.localhost/w
      keys:
        ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
      webhook:
        api_key: ${LIVEKIT_API_KEY}
        urls:
          - http://localhost:${TRANSLATOR_PORT:-3100}/webhook

  egress:
    content: |
      redis:
        address: localhost:6379
      api_key: ${LIVEKIT_API_KEY}
      api_secret: ${LIVEKIT_API_SECRET}
      ws_url: wss://livekit.localhost

  ingress:
    content: |
      redis:
        address: localhost:6379
      api_key: ${LIVEKIT_API_KEY}
      api_secret: ${LIVEKIT_API_SECRET}
      ws_url: wss://livekit.localhost
      rtmp_port: 1935
      whip_port: 8080
      http_relay_port: 9090
      rtc_config:
        udp_port: 7885
        use_external_ip: false
        enable_loopback_candidate: false

volumes:
  temporal-postgres:
  opensearch-data:
